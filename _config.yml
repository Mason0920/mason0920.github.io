about_content: |
  ## **Introduction**

  AWS와 GCP 위에서 Kubernetes 플랫폼을 설계하고 운영해 온 4년 차(2022.04~) DevOps 엔지니어입니다.
  EKS를 Terraform으로 처음 구성해 운영 클러스터로 전환했고, Karpenter Spot 우선 프로비저닝, GitOps 배포, 관측성과 알람 체계를 맡아 왔습니다.
  "한번 떨어진 신뢰는 회복하기 힘들다"는 원칙으로 수치와 장애 원인을 교차 검증하고, 하는 일은 블로그와 GitHub에 글과 코드로 남깁니다.

  ---

  ## **How I Work**

  - [<u>블로그</u>](https://thereisnotherway.tistory.com/): 운영하며 만난 문제와 해결 과정을 문제, 시도, 결과 순서로 기록합니다.
  - [<u>GitHub</u>](https://github.com/Mason0920): 회사에서 쓰던 패턴을 개인 시간에 처음부터 다시 구현해 코드로 공개합니다.
  - AI 코딩 에이전트(Claude Code)를 배포 구성과 운영 수치 검증에 쓰고, 결과는 직접 교차 검증합니다.

