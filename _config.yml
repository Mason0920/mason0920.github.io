  - title: Experience
    layout: list
    content:
      - layout: left
        title: 주식회사 마켓보로 (CJ그룹 계열)
        sub_title: DevOps 엔지니어, 클라우드 인프라 운영
        caption: 2023.08 - 현재
        description: |
          - **EKS 플랫폼 설계·도입 (2023.09 설계 착수, 2024 운영 전환):**
            Terraform으로 EKS와 Karpenter IaC를 처음 구성. 노드 46-65대, Pod 약 500-670개 규모 운영 클러스터를 ArgoCD GitOps로 운영.
          - **Spot 우선 비용 최적화:**
            Karpenter Spot 우선 프로비저닝을 설계해 운영 클러스터 vCPU의 63-66%를 Spot으로 운영. NodePool을 정리하고 Karpenter 구성 대부분을 직접 작성.
          - **단위 효율:**
            월 요청량이 2.2배 느는 동안 vCPU 증가는 1.7배로 억제해 요청당 컴퓨팅(vCPU-시간) 약 20% 절감 (2025.09 - 2026.10).
          - **배포 안정성:**
            Health check, graceful shutdown 가이드와 ALB Pod Readiness Gate를 도입해 배포 중 5xx를 줄임. 주 서비스 90일 요청 성공률 99.97%(5xx 제외).
          - **오토스케일링·알람 개선 (팀 공동):**
            Aurora 리더·ECS 오토스케일링 적용, 리더 CPU 과부하 시간 77% 감소. 알람을 3단계 심각도로 재분류하고 수집 경로를 정리.
          - **관측성:**
            Prometheus, Grafana, Loki, OpenTelemetry 구성. Lambda 로그를 Loki 레이어로 전환하고 OpenTelemetry 계측 적용.
          - **보안:**
            CI/CD와 워크로드의 정적 액세스 키를 IAM OIDC, IRSA, GCP Workload Identity Federation 기반 Keyless 인증으로 전환.
          - **운영 도구:**
            CronJob 실행·관리 도구 개발 (Go). ElasticSearch, Redis Cluster, Airflow, Redash, Growthbook을 Kubernetes에서 운영.
          - **AI 활용:**
            Claude Code로 배포 구성과 운영 분석 수치를 교차 검증하는 절차 도입, 팀용 Claude Code 활용 가이드 작성.

      - layout: left
        title: 주식회사 와탭랩스
        sub_title: 테스트 자동화 및 SaaS 운영
        caption: 2022.04 - 2023.08
        description: |
          - **테스트 자동화:**
            EKS에 Selenium Grid 구성, UI 테스트 스크립트 작성, 배포 시 테스트 실행과 Prometheus·Slack 연동으로 결과 가시화.
          - **SaaS 운영:**
            Java 애플리케이션 장애 대응·분석, Disk full·OOM 분석으로 병목 파악과 대응, 관련 보고서 작성.

      - layout: left
